global:
  scrape_interval: 10s

scrape_configs:
  # Scrape the OTel Collector's Prometheus exporter, which receives
  # OTLP metrics from relay and re-exports them as Prometheus format.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Optionally scrape relay directly if it exposes a /metrics endpoint.
