receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Print everything to the collector's stdout for quick debugging
  debug:
    verbosity: detailed

  # Forward logs to Loki for Grafana
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Forward metrics to Prometheus (optional, for completeness)
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug, otlphttp/loki]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus]
