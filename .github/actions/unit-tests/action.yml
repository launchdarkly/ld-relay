name: Unit Tests
description: "Runs Relay's unit tests + linters and optionally gathers coverage."
inputs:
  lint:
    description: 'Whether to run linters.'
    required: false
    default: 'false'
  coverage:
    description: 'Whether to run coverage.'
    required: false
    default: 'false'
  suffix:
    description: 'Suffix for artifact names to differentiate test runs.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Get Go version
      id: go-version
      shell: bash
      run: |
        echo "version=$(go version | awk '{print $3}')" >> $GITHUB_OUTPUT
    - name: Lint
      if: inputs.lint == 'true'
      shell: bash
      run: make lint

    - name: Test
      shell: bash
      id: test
      run: TAGS='big_segment_external_store_tests,redis_unit_tests' make test | tee raw_report.txt

    - name: Process test results
      if: steps.test.outcome == 'success'
      id: process-test
      shell: bash
      run: go run github.com/jstemmer/go-junit-report@cc1f095d5cc5eca2844f5c5ea7bb37f6b9bf6cac < raw_report.txt > junit_report.xml

    - name: Test with coverage
      if: inputs.coverage == 'true'
      shell: bash
      id: test-coverage
      run: make test-coverage

    - name: Upload test results
      if: steps.process-test.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Test-result-${{ steps.go-version.outputs.version }}${{ inputs.suffix && format('-{0}', inputs.suffix) || '' }}
        path: junit_report.xml

    - name: Upload coverage results
      if: steps.test-coverage.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Coverage-result-${{ steps.go-version.outputs.version }}${{ inputs.suffix && format('-{0}', inputs.suffix) || '' }}
        path: build/coverage*
