name: Run Release Please

on:
  push:
    branches:
      - v8

jobs:
  go-versions:
    uses: ./.github/workflows/go-versions.yml

  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{secrets.GITHUB_TOKEN}}

  release-relay:
    permissions:
      id-token: write # Needed to obtain Docker tokens and to sign attestations
      contents: write # Needed to upload release artifacts
      attestations: write # Needed for artifact attestations
    outputs:
      images_and_digests: ${{ steps.publish.outputs.images_and_digests }}
    needs: [ release-please, go-versions ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists, skipping creation."
          else
            echo "Creating tag ${TAG_NAME}."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
        name: 'Get Docker token'
        with:
          aws_assume_role: ${{ vars.AWS_ROLE_ARN }}
          ssm_parameter_pairs: '/global/services/docker/public/username = DOCKER_USERNAME, /global/services/docker/public/token = DOCKER_TOKEN'

      - name: Setup Go ${{ needs.go-versions.outputs.latest }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go-versions.outputs.latest }}

      - uses: launchdarkly/gh-actions/actions/persistent-stores@persistent-stores-v0.2.0
        with:
          dynamodb: true
          redis: true
      - uses: ./.github/actions/unit-tests

      - name: Set IS_DEFAULT_BRANCH
        run: echo "IS_DEFAULT_BRANCH=$([[ '${{ github.ref_name }}' == '${{ github.event.repository.default_branch }}' ]] && echo true || echo false)" >> $GITHUB_ENV

      - uses: ./.github/actions/publish
        id: publish
        with:
          dry-run: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-please.outputs.tag_name }}
          update-major-tag: ${{ env.IS_DEFAULT_BRANCH }}
          update-latest-tag: ${{ env.IS_DEFAULT_BRANCH }}

      - name: Attest binary artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.publish.outputs.checksum_file }}

  attest-image-provenance:
    needs: ['release-relay']
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    strategy:
      matrix:
        images_and_digests: ${{fromJson(needs.release-relay.outputs.images_and_digests)}}
    steps:
      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.images_and_digests.image }}
          subject-digest: ${{ matrix.images_and_digests.digest }}

  publish-release:
    needs: ['release-please', 'release-relay', 'attest-image-provenance']
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: >
          gh release edit "$TAG_NAME"
          --repo ${{ github.repository }}
          --draft=false
