name: CI
on:
  push:
    branches: ["v9"]
    paths-ignore:
      - "**.md" # Don't run CI on markdown changes.
  pull_request:
    branches: ["v9", "feat/**"]
    paths-ignore:
      - "**.md"

jobs:
  go-versions:
    uses: launchdarkly/gh-actions/.github/workflows/sdk-go-version-matrix.yml@main

  # Runs the common tasks (unit tests, lint, benchmarks, installation test)
  # against each Go version in the matrix.
  go-matrix:
    name: ${{ format('Go {0}, {1}', matrix.go-version, matrix.store) }}
    needs: go-versions
    strategy:
      # Let jobs fail independently, in case it's a single version that's broken.
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}
        store: [Redis, Valkey]
        include:
          - store: Redis
            redis: true
            suffix: redis
          - store: Valkey
            valkey: true
            valkey_port: 6379
            suffix: valkey
    uses: ./.github/workflows/common_ci.yml
    with:
      go-version: ${{ matrix.go-version }}
      store: ${{ matrix.store }}
      redis: ${{ matrix.redis || false }}
      valkey: ${{ matrix.valkey || false }}
      valkey_port: ${{ matrix.valkey_port || '' }}
      suffix: ${{ matrix.suffix }}

  # Integration tests run only on the latest Go version since they are more
  # time intensive, and we'd likely be rate-limited by LaunchDarkly SaaS if we
  # ran them in parallel for multiple Go versions.
  integration-test:
    needs: go-versions
    uses: ./.github/workflows/integration-test.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: "staging"
      go-version: ${{ needs.go-versions.outputs.latest }}

  security-scan:
    needs: go-versions
    runs-on: ubuntu-latest
    name: "Docker Scout Scan"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: "true"
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-versions.outputs.latest }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
      - name: Build Docker Images
        run: make products-for-release
      - name: Get current Relay version
        id: image-tag
        run: echo "value=$(jq -r '.version' < dist/metadata.json)" >> $GITHUB_OUTPUT
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_RO_TOKEN }}
      - uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        id: scan-distroless
        continue-on-error: true
        with:
          command: cves
          image: local://launchdarkly/ld-relay:${{ steps.image-tag.outputs.value }}-static-debian13-nonroot-amd64
          exit-code: true
          only-fixed: true
          write-comment: false
      - uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        continue-on-error: true
        id: scan-debug-distroless
        with:
          command: cves
          image: local://launchdarkly/ld-relay:${{ steps.image-tag.outputs.value }}-static-debian13-debug-nonroot-amd64
          exit-code: true
          only-fixed: true
          write-comment: false
      - name: Fail if either scan-distroless or scan-debug-distroless failed
        if: ${{ steps.scan-distroless.outcome != 'success' || steps.scan-debug-distroless.outcome != 'success' }}
        run: exit 1
