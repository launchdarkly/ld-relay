version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'
  - package-ecosystem: 'github-actions'
    target-branch: 'v8'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'
