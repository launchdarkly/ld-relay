version: 2

project_name: ld-relay

builds:
- env:
  - CGO_ENABLED=0
  main: .
  binary: ld-relay
  ldflags:
  - -s -w
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - '386'
    - amd64
    - arm
    - arm64
  goarm:
    - "7"
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: arm

nfpms:
  -
    file_name_template: >-
      {{ .ConventionalFileName }}
    homepage: https://launchdarkly.com/
    maintainer: LaunchDarkly <team@launchdarkly.com>
    description: LaunchDarkly Stream Relay Proxy
    license: Apache 2.0
    vendor: Catamorphic Co.

    formats:
    - deb
    - rpm

    contents:
      - src: linux/etc/ld-relay.conf
        dst: /etc/ld-relay.conf
        type: config

      - src: linux/etc/init/ld-relay.conf
        dst: /etc/init/ld-relay.conf
        packager: deb

      - src: linux/etc/system/ld-relay.service
        dst: /usr/lib/systemd/system/ld-relay.service
        packager: rpm

    overrides:
      deb:
        dependencies:
        - upstart
      rpm:
        dependencies:
        - systemd

release:
  disable: true

# dockers_v2 replaces the legacy dockers + docker_manifests sections.
# It uses docker buildx natively to build multi-arch manifests in a single step,
# eliminating the need for per-architecture image entries and separate manifest wiring.
dockers_v2:
  # Alpine-based image (default tags + "-alpine" alias for future deprecation of bare tags)
  - id: alpine
    dockerfile: Dockerfile.goreleaser
    images:
      - "launchdarkly/ld-relay"
    tags:
      - "{{ .Version }}"
      - "{{ .Version }}-alpine"
      - '{{ if eq .Env.LD_RELEASER_UPDATE_MAJOR "true" }}v{{ .Major }}{{ end }}'
      - '{{ if eq .Env.LD_RELEASER_UPDATE_MAJOR "true" }}v{{ .Major }}-alpine{{ end }}'
      - '{{ if eq .Env.LD_RELEASER_UPDATE_LATEST "true" }}latest{{ end }}'
      - '{{ if eq .Env.LD_RELEASER_UPDATE_LATEST "true" }}latest-alpine{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
      - linux/386
    extra_files:
      - linux/etc/ld-relay.conf

  # Distroless static debian12 nonroot
  - id: static-debian12-nonroot
    dockerfile: Dockerfile-static-debian12-nonroot.goreleaser
    images:
      - "launchdarkly/ld-relay"
    tags:
      - "{{ .Version }}-static-debian12-nonroot"
      - '{{ if eq .Env.LD_RELEASER_UPDATE_MAJOR "true" }}v{{ .Major }}-static-debian12-nonroot{{ end }}'
      - '{{ if eq .Env.LD_RELEASER_UPDATE_LATEST "true" }}latest-static-debian12-nonroot{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7

  # Distroless static debian12 debug nonroot (includes shell for debugging)
  - id: static-debian12-debug-nonroot
    dockerfile: Dockerfile-static-debian12-debug-nonroot.goreleaser
    images:
      - "launchdarkly/ld-relay"
    tags:
      - "{{ .Version }}-static-debian12-debug-nonroot"
      - '{{ if eq .Env.LD_RELEASER_UPDATE_MAJOR "true" }}v{{ .Major }}-static-debian12-debug-nonroot{{ end }}'
      - '{{ if eq .Env.LD_RELEASER_UPDATE_LATEST "true" }}latest-static-debian12-debug-nonroot{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
